
name: Build NavHide 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build NavHide APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check project files
        run: |
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build Debug and Release APK
        run: |
          gradle --no-daemon clean assembleDebug assembleRelease

      - name: List APK outputs
        if: always()
        run: |
          find app/build/outputs/apk -type f -name "*.apk" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NavHide-2.0-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NavHide-2.0-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
