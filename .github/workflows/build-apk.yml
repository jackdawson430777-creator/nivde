
name: Build NavHide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 获取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 配置 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 安装 Android SDK
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 配置 Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 编译 APK
      - name: Build Release APK
        working-directory: NavHideModule
        run: |
          gradle --no-daemon clean assembleRelease

      # 检查 APK 是否生成
      - name: Check APK
        run: |
          test -f NavHideModule/app/build/outputs/apk/release/app-release.apk

      # 检查 ZIP 对齐
      - name: Verify ZIP Alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
          -c -v 4 \
          NavHideModule/app/build/outputs/apk/release/app-release.apk

      # 验证 APK 签名
      - name: Verify APK Signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
          verify --verbose --print-certs \
          NavHideModule/app/build/outputs/apk/release/app-release.apk

      # 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavHide-Release-APK
          path: NavHideModule/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
